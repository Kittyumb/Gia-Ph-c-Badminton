function schedule(teams){let ids=teams.map(t=>t.id),list=[];if(ids.length<4)throw Error('Cần ít nhất 4 đội để đánh đồng thời trên 2 sân.');if(ids.length===8){let p=[...ids];for(let r=0;r<4;r++){for(let k=0;k<4;k++){let court=k%2+1,slot=r*2+Math.floor(k/2)+1;list.push(match((slot-1)*2+court,court,slot,p[k],p[7-k]))}p=[p[0],p[7],...p.slice(1,7)]}return list.sort((a,b)=>Number(a.id.slice(1))-Number(b.id.slice(1)))}let played=Object.fromEntries(ids.map(x=>[x,0])),freq={},previous=new Set();for(let slot=1;slot<=8;slot++){let possible=[];for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++)for(let c=0;c<ids.length;c++)for(let d=c+1;d<ids.length;d++){let q=[a,b,c,d];if(new Set(q).size!==4)continue;let ab=keyPair(ids[a],ids[b]),cd=keyPair(ids[c],ids[d]);let cost=(freq[ab]||0)*70+(freq[cd]||0)*70+(played[ids[a]]+played[ids[b]]+played[ids[c]]+played[ids[d]])*12+q.filter(x=>previous.has(ids[x])).length*3+q.reduce((v,x)=>v+x,0)/100;if(!possible.length||cost<possible[0].cost)possible=[{a,b,c,d,cost}] }let p=possible[0];if(!p)throw Error('Không xếp được lịch.');list.push(match((slot-1)*2+1,1,slot,ids[p.a],ids[p.b]),match((slot-1)*2+2,2,slot,ids[p.c],ids[p.d]));previous=new Set([ids[p.a],ids[p.b],ids[p.c],ids[p.d]]);for(let q of previous)played[q]++;freq[keyPair(ids[p.a],ids[p.b])]=(freq[keyPair(ids[p.a],ids[p.b])]||0)+1;freq[keyPair(ids[p.c],ids[p.d])]=(freq[keyPair(ids[p.c],ids[p.d])]||0)+1}return list}

function exportBlob(name,mime,txt){let url=URL.createObjectURL(new Blob([txt],{type:mime})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function seed(){if(!allOuter())return toast('Chưa đủ 16 trận.',true);let r=standings(),tie=tieGroups(r).filter(g=>!g.arr[0].tieResolved);if(tie.length){toast('BTC cần xác nhận thứ tự các đội còn đồng hạng trước.',true);return}if(new Set(r.map(x=>x.scheduled)).size>1&&!confirm('Số trận của các đội không đều nhau. Vẫn chốt top 4 theo tổng điểm thưởng?'))return;if(!confirm('Chốt TOP 4:\n'+r.slice(0,4).map((x,i)=>(i+1)+'. '+x.name+' — '+x.bonus+' điểm, HS '+x.diff).join('\n')+'\n\nTiếp tục xếp bán kết?'))return;let s=r.slice(0,4).map(x=>x.id);S.bracket={seeds:s,games:{sf1:koGame(s[0],s[3]),sf2:koGame(s[1],s[2]),final:null,third:null}};S.page='semi';save();render();toast('Đã chốt Top 4 và tạo 2 trận bán kết.')}
function tieMove(sig,id,dir){let r=standings(),arr=r.filter(x=>x.tieSig===sig);if(!arr.length)return;let ids=arr.map(x=>x.id),at=ids.indexOf(id),to=at+dir;if(to<0||to>=ids.length)return;[ids[at],ids[to]]=[ids[to],ids[at]];S.tieOrder[sig]=ids;delete S.tieConfirm?.[sig];save();render()}
function confirmTie(sig){if(!S.tieConfirm)S.tieConfirm={};S.tieConfirm[sig]=true;let r=standings(),arr=r.filter(x=>x.tieSig===sig);S.tieOrder[sig]=arr.map(x=>x.id);save();render();toast('Đã ghi nhận thứ tự BTC xác nhận.')}
// A tie is resolved only when it has a current order AND explicit BTC confirmation.
const oldStandings=standings;

function resolvedTieGroups(){let r=standings();for(let x of r){if(x.tieSig)x.tieResolved=!!(S.tieConfirm?.[x.tieSig]&&S.tieOrder[x.tieSig])}return r}

function seedStrict(){if(!allOuter())return toast('Chưa đủ 16 trận.',true);let r=resolvedTieGroups(),tie=tieGroups(r).filter(g=>!g.arr[0].tieResolved);if(tie.length)return toast('Hãy nhấn “BTC xác nhận thứ tự” cho nhóm đồng hạng.',true);if(new Set(r.map(x=>x.scheduled)).size>1&&!confirm('Số trận các đội không đều nhau. Vẫn chốt Top 4 theo tổng điểm thưởng?'))return;if(!confirm('XÁC NHẬN TOP 4:\n'+r.slice(0,4).map((x,i)=>(i+1)+'. '+x.name+' · '+x.bonus+' điểm · HS '+x.diff).join('\n')+'\n\nTạo lịch bán kết?'))return;let s=r.slice(0,4).map(x=>x.id);S.bracket={seeds:s,games:{sf1:koGame(s[0],s[3]),sf2:koGame(s[1],s[2]),final:null,third:null}};S.page='semi';save();render();toast('Đã chốt top 4 và ghép bán kết.')}

document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act,id=b.dataset.id,k=b.dataset.side,m=getMatch(id),g=S.bracket?.games?.[id];switch(a){
case 'nav':nav(b.dataset.page);return;
case 'court':S.court=Number(b.dataset.value);S.active='m'+S.court;break;
case 'open-match':S.active=id;break;
case 'outer-step':if(!m||m.final||m.forfeit)return;if(!afterOuterChange())return;m['s'+k]=number(m['s'+k]+Number(b.dataset.num));break;
case 'outer-reset':if(!m||m.final)return;if(!afterOuterChange())return;m.sa=0;m.sb=0;m.forfeit='';break;
case 'outer-reopen':if(!m||!afterOuterChange())return;m.final=false;break;
case 'outer-final':if(!m)return;if(!m.a||!m.b||m.a===m.b)return toast('Hãy chọn hai đội khác nhau trong Cài đặt.',true);if(!m.forfeit&&m.sa===m.sb)return toast('Tỷ số không được hòa. Hãy nhập điểm thực tế.',true);if(!afterOuterChange())return;m.final=true;save();render();toast('Đã chốt kết quả và cập nhật BXH.');return;
case 'seed':seedStrict();return;
case 'reset-bracket':if(!confirm('Xóa toàn bộ kết quả bán kết và chung kết để chốt lại top 4?'))return;S.bracket=null;break;
case 'tie-up':tieMove(b.dataset.sig,id,-1);return;
case 'tie-down':tieMove(b.dataset.sig,id,1);return;
case 'tie-confirm':confirmTie(b.dataset.sig);return;
case 'ko-step':if(!g||g.final||g.forfeit)return;g['s'+k]=number(g['s'+k]+Number(b.dataset.num));break;
case 'ko-final':if(!g)return;if(!g.forfeit&&g.sa===g.sb)return toast('Trận hòa chưa thể chốt.',true);g.final=true;syncBracket();save();render();toast('Đã chốt kết quả.');return;
case 'ko-reopen':if(!g||!invalidateBeforeKoChange(id))return;g.final=false;syncBracket();break;
case 'setting-tab':S.settingTab=b.dataset.value;break;
case 'add-team':if(S.teams.length>=32)return toast('Tối đa 32 đội.',true);S.teams.push({id:'t'+Date.now(),name:'Đội '+String(S.teams.length+1).padStart(2,'0'),p1:'',p2:''});toast('Đã thêm đội, nhớ tạo lại lịch để đội được thi đấu.');break;
case 'remove-team':if(S.teams.length<=4)return toast('Cần tối thiểu 4 đội.',true);if(!confirm('Xóa '+teamName(id)+'? Các trận liên quan sẽ cần xếp lại.'))return;if(S.bracket&&!afterOuterChange())return;S.teams=S.teams.filter(t=>t.id!==id);S.matches.forEach(m=>{if(m.a===id||m.b===id){m.a=m.a===id?'':m.a;m.b=m.b===id?'':m.b;m.final=false}});S.tieOrder={};S.tieConfirm={};break;
case 'generate':if(!confirm('Tạo lại toàn bộ 16 trận và xóa kết quả đã ghi? Hãy sao lưu trước khi thực hiện.'))return;S.matches=schedule(S.teams);S.bracket=null;S.tieOrder={};S.tieConfirm={};S.court=1;S.active='m1';toast('Đã tạo lại 16 trận chia cho 2 sân.');break;
case 'backup':backup();return;case 'csv':csv();return;case 'restore':$('#restore-file').click();return;case 'print':window.print();return;case 'reset':resetAll();return;default:return}
save();render()});
document.addEventListener('change',e=>{let el=e.target,type=el.dataset.kind,id=el.dataset.id,k=el.dataset.side,m=getMatch(id),g=S.bracket?.games?.[id];if(!type)return;
if(type==='outer-score'){if(!m||m.final||!afterOuterChange()){render();return}m['s'+k]=number(el.value)}
else if(type==='outer-forfeit'){if(!m||m.final||!afterOuterChange()){render();return}m.forfeit=el.value}
else if(type==='ko-score'){if(!g||g.final)return;g['s'+k]=number(el.value)}
else if(type==='ko-forfeit'){if(!g||g.final)return;g.forfeit=el.value}
else if(type==='team-name'){let t=team(id);if(t)t.name=el.value.trim()||t.name}
else if(type==='player1'||type==='player2'){let t=team(id);if(t)t[type==='player1'?'p1':'p2']=el.value.trim()}
else if(type==='court-name'){S.courts[Number(id)]=el.value.trim()||'Sân '+(Number(id)+1)}
else if(type==='pair'){if(!m)return;if(el.value===m[k])return;if(!afterOuterChange()){render();return}m[k]=el.value;m.final=false;m.sa=0;m.sb=0;m.forfeit='';S.tieConfirm={};if(m.a===m.b&&m.a)toast('Cặp đấu trùng đội. Hãy chọn hai đội khác nhau.',true)}
else return;save();render()});
$('#restore-file').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let v=JSON.parse(await f.text());if(v.v!==2||!Array.isArray(v.teams)||v.teams.length<4||!Array.isArray(v.matches)||v.matches.length!==16||!v.matches.every(x=>x.id&&x.court&&x.slot))throw Error('File sao lưu không đúng định dạng Gia Phúc Cup 2026.');if(!confirm('Khôi phục sẽ thay thế tất cả dữ liệu đang lưu. Tiếp tục?'))return;S={...v,page:'outer',court:1,active:'m1',settingTab:'teams'};S.tieOrder??={};S.tieConfirm??={};save();render();toast('Đã khôi phục dữ liệu giải đấu.')}catch(err){toast('Không thể đọc bản sao lưu: '+err.message,true)}finally{e.target.value=''}});
window.addEventListener('beforeunload',()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}});
// Keep confirmation state separate from ranking sort order.
S.tieConfirm??={};const rankedOriginal=standings;standings=function(){let rows=rankedOriginal();rows.forEach(x=>{if(x.tieSig)x.tieResolved=!!(S.tieConfirm[x.tieSig]&&S.tieOrder[x.tieSig])});return rows};
render();
})();
